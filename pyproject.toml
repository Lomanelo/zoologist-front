[project]
name = "zoologist-front"
version = "0.1.0"
description = "A Streamlit front-end for the Zoologist project"
readme = "README.md"
requires-python = ">=3.12.9"
dependencies = [
    "accelerate>=1.16.0",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langchain-huggingface>=1.3.0",
    "langchain-ollama>=1.2.0",
    "langchain-openai>=1.8.5",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "transformers>=5.24.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
